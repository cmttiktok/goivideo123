<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call Private</title>
    <!-- Nhúng thư viện PeerJS mã nguồn chuẩn -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f13;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #video-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #local-video {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 160px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
            background: #222;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.4); }
        .btn-end { background: #ff3b30; }
        .btn-end:hover { background: #e02e24; }
        #header-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0));
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-container h3 { font-size: 18px; font-weight: 600; }
        .status-text { font-size: 12px; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .online .dot { background: #34c759; box-shadow: 0 0 8px #34c759; }
        .offline .dot { background: #ff3b30; box-shadow: 0 0 8px #ff3b30; }
        .status-label { color: rgba(255,255,255,0.6); }
        .online .status-label { color: #34c759; }
        .offline .status-label { color: #ff3b30; }
    </style>
</head>
<body>

    <div id="video-container">
        <!-- Thanh trạng thái phía trên -->
        <div id="header-bar">
            <div class="status-container">
                <h3 id="partner-name">Kết nối...</h3>
                <div id="status-indicator" class="status-text offline">
                    <span class="dot"></span>
                    <span class="status-label">Ngoại tuyến</span>
                </div>
            </div>
        </div>

        <!-- Khung hiển thị Video -->
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>

        <!-- Thanh điều khiển cuộc gọi -->
        <div id="controls">
            <button class="btn" id="btn-toggle-cam"><i class="fas fa-video"></i></button>
            <button class="btn" id="btn-toggle-mic"><i class="fas fa-microphone"></i></button>
            <button class="btn btn-end" id="btn-end-call"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <script>
        // Tự động nhận diện ID dựa vào URL: /?id=anh hoặc /?id=chi
        const urlParams = new URLSearchParams(window.location.search);
        const userRole = urlParams.get('id'); 

        let myId = '';
        let partnerId = '';
        let partnerName = '';

        if (userRole === 'anh') {
            myId = 'tuananh';
            partnerId = 'bechi';
            partnerName = 'Bé Chi ❤️';
        } else {
            myId = 'bechi';
            partnerId = 'tuananh';
            partnerName = 'Anh ❤️';
        }

        document.getElementById('partner-name').innerText = partnerName;

        let localStream = null;
        let peer = null;
        let currentCall = null;
        let dataConn = null;
        let lastOnlineTime = 0;

        // KHỞI TẠO PEER KẾT NỐI ĐẾN VPS GOOGLE CLOUD RIÊNG (CHỐNG CHẶN 4G)
        peer = new Peer(myId, {
            host: '136.110.53.145',
            port: 9000,
            path: '/myapp',
            key: 'peerjs',
            config: { 
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' }, 
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { 
                        urls: [
                            'turn:136.110.53.145:3478?transport=udp',
                            'turn:136.110.53.145:3478?transport=tcp'
                        ], 
                        username: 'tuanaturn', 
                        credential: '270799' 
                    }
                ],
                'iceTransportPolicy': 'all',
                'sdpSemantics': 'unified-plan'
            } 
        });

        // Lấy quyền truy cập Camera/Microphone
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                document.getElementById('local-video').srcObject = stream;
                
                // Lắng nghe cuộc gọi đến
                peer.on('call', call => {
                    currentCall = call;
                    call.answer(localStream);
                    call.on('stream', remoteStream => {
                        document.getElementById('remote-video').srcObject = remoteStream;
                    });
                    call.on('close', () => { endCallUI(); });
                });
            })
            .catch(err => {
                alert("Không thể truy cập Máy ảnh/Microphone: " + err.message);
            });

        // Xử lý kết nối dữ liệu (Data Connection) để đồng bộ trạng thái trực tuyến
        peer.on('connection', conn => {
            dataConn = conn;
            setupDataHandlers();
        });

        function setupDataHandlers() {
            dataConn.on('data', data => {
                if (data === 'ping') {
                    lastOnlineTime = Date.now();
                    updateUIStatus(true);
                }
            });
        }

        // TỐI ƯU KIỂM TRA TRỰC TUYẾN: Tránh nghẽn băng thông mạng di động 4G
        function checkPartnerStatus() {
            if (currentCall) return;
            
            const conn = peer.connect(partnerId, { reliable: false, timeout: 2000 });
            
            conn.on('open', () => { 
                lastOnlineTime = Date.now(); 
                if(!dataConn || !dataConn.open) { 
                    dataConn = peer.connect(partnerId); 
                    setupDataHandlers(); 
                }
                updateUIStatus(true); 
                setTimeout(() => { conn.close(); }, 500); // Đóng nhanh để giải phóng luồng rác
            });

            conn.on('error', () => {
                conn.close();
            });
            
            setTimeout(() => { 
                if (Date.now() - lastOnlineTime > 7000) {
                    updateUIStatus(false); 
                }
            }, 3500);
        }

        // Định kỳ gửi lệnh kiểm tra trạng thái mỗi 3 giây
        setInterval(checkPartnerStatus, 3000);

        function updateUIStatus(isOnline) {
            const indicator = document.getElementById('status-indicator');
            const label = indicator.querySelector('.status-label');
            if (isOnline) {
                indicator.className = 'status-text online';
                label.innerText = 'Đang hoạt động';
            } else {
                indicator.className = 'status-text offline';
                label.innerText = 'Ngoại tuyến';
            }
        }

        // Tạo cuộc gọi khi nhấp đúp màn hình hoặc tự động kích hoạt
        document.getElementById('remote-video').addEventListener('click', () => {
            if (!currentCall && localStream) {
                const call = peer.call(partnerId, localStream);
                currentCall = call;
                call.on('stream', remoteStream => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
                call.on('close', () => { endCallUI(); });
            }
        });

        function endCallUI() {
            document.getElementById('remote-video').srcObject = null;
            currentCall = null;
        }

        // Điều khiển nút Bật/Tắt Mic và Cam
        let videoTrack = true;
        document.getElementById('btn-toggle-cam').addEventListener('click', () => {
            videoTrack = !videoTrack;
            localStream.getVideoTracks()[0].enabled = videoTrack;
            document.getElementById('btn-toggle-cam').innerHTML = videoTrack ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
        });

        let audioTrack = true;
        document.getElementById('btn-toggle-mic').addEventListener('click', () => {
            audioTrack = !audioTrack;
            localStream.getAudioTracks()[0].enabled = audioTrack;
            document.getElementById('btn-toggle-mic').innerHTML = audioTrack ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
        });

        document.getElementById('btn-end-call').addEventListener('click', () => {
            if (currentCall) {
                currentCall.close();
                endCallUI();
            }
        });
    </script>
</body>
</html>
